# Example draft rule set for tests and the admin panel's first load. UNREVIEWED: rates are the founder's working
# defaults from docs/product/restaurant-mvp-spec.md RM-T1 (fnb_standard 5 percent, or 18 percent for specified premises;
# alcohol outside GST; exempt) and await CA sign-off (ADR-0014 Data needed 1). Not a published version and never emitted
# as is; the effective date is a placeholder. Validates against ../rule-set.schema.yaml.
name: GST restaurant services (draft, unreviewed)
effective_date: '2027-04-01'
calc_v: 1
rules:
  # regular regime, dine in
  - {tax_class: fnb_standard, regime: regular, specified_premises: false, order_channel: dine_in, doc_type: tax_invoice, gst_applies: true, cgst_bp: 250, sgst_bp: 250, igst_bp: 0}
  - {tax_class: fnb_standard, regime: regular, specified_premises: true, order_channel: dine_in, doc_type: tax_invoice, gst_applies: true, cgst_bp: 900, sgst_bp: 900, igst_bp: 0}
  - {tax_class: fnb_non_gst, regime: regular, specified_premises: false, order_channel: dine_in, doc_type: tax_invoice, gst_applies: false, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  - {tax_class: fnb_non_gst, regime: regular, specified_premises: true, order_channel: dine_in, doc_type: tax_invoice, gst_applies: false, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  - {tax_class: exempt, regime: regular, specified_premises: false, order_channel: dine_in, doc_type: tax_invoice, gst_applies: true, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  - {tax_class: exempt, regime: regular, specified_premises: true, order_channel: dine_in, doc_type: tax_invoice, gst_applies: true, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  # takeaway and counter follow dine in until the CA says otherwise (the rows exist so a later change is data)
  - {tax_class: fnb_standard, regime: regular, specified_premises: false, order_channel: takeaway, doc_type: tax_invoice, gst_applies: true, cgst_bp: 250, sgst_bp: 250, igst_bp: 0}
  - {tax_class: fnb_standard, regime: regular, specified_premises: false, order_channel: counter, doc_type: tax_invoice, gst_applies: true, cgst_bp: 250, sgst_bp: 250, igst_bp: 0}
  # ECO (aggregator) supply: document form and rate are CA-pending; no GST charged by the restaurant is the working assumption (Section 9(5)).
  - {tax_class: fnb_standard, regime: regular, specified_premises: false, order_channel: eco, doc_type: tax_invoice, gst_applies: false, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  # composition and unregistered: no tax, other document types
  - {tax_class: fnb_standard, regime: composition, specified_premises: false, order_channel: dine_in, doc_type: bill_of_supply, gst_applies: false, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
  - {tax_class: fnb_standard, regime: unregistered, specified_premises: false, order_channel: dine_in, doc_type: plain_bill, gst_applies: false, cgst_bp: 0, sgst_bp: 0, igst_bp: 0}
